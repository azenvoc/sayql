[package]
name = "sayql"
version = "0.6.0"
description = "AI-first database client: ask in English, get SQL as you type"
authors = ["Adith"]
edition = "2024"
# `tauri dev` runs the app; the MCP server is the separate `sayql-mcp` binary.
default-run = "sayql"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sayql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The code rules every change follows (AGENTS.md). CI fails on any warning these produce
# beyond the per-file counts in lint-baseline.json, which may only go down
# (scripts/lint-ratchet.mjs). An exception is `#[expect(lint, reason = "...")]` on the item.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Release builds abort on a panic, so code must not panic on data from outside.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
# Byte-slicing text panics inside a multi-byte character.
string_slice = "warn"
# stdout is the MCP protocol; errors go back to the caller instead of stderr.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util"] }
futures-util = "0.3"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  # The platform's TLS (Security.framework, SChannel, OpenSSL) rather than rustls: rustls has no
  # DHE or RSA key exchange, which is all MySQL 5.7's OpenSSL 1.0.2 actually negotiates.
  "tls-native-tls",
  "postgres",
  "mysql",
  # MySQL 8 sends the password RSA-encrypted when the connection has no TLS.
  "mysql-rsa",
  "sqlite",
  "chrono",
  "uuid",
  "json",
  "rust_decimal",
] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-updater = "2"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
rmcp = { version = "3.6.0", features = ["server", "transport-io", "macros"] }
dirs = "7"
schemars = "1"
url = "2"
open = "5"
whisper-rs = "0.16"
cpal = "0.18"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-dialog = "2"
html2text = "0.17"
pdf-extract = "0.12"
# 9.0.5+ fixes GHSA-m665-v7pm-7grj and the extract() advisories. SayQL only reads entries by
# name (DOCX text, the pinned OpenCode archive), so deflate through the flate2 already used here.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
# Unpacking the built-in OpenCode and ripgrep on Linux and macOS (.tar.gz).
flate2 = "1"
tar = "0.4"
# TypeScript types and typed command wrappers for the UI (src/api/bindings.ts), generated from
# the Rust types by `pnpm gen:types` (a test in src/bindings.rs), never at app startup.
# Pinned exactly: specta 2 is still a release candidate and tauri-specta needs this specta.
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
# canonicalize without Windows' `\\?\` prefix, which OpenCode's path rules don't match. The same as
# std on macOS and Linux. Already in the tree through tauri.
dunce = "1.0.5"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
# setrlimit without unsafe code, to cap the PDF reader's memory (audit/knowledge/pdf.rs). Already in
# the tree through tempfile.
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
# tauri-plugin-deep-link 2.6.2 doesn't compile with rust-ini 0.21.2+ (new ParseOption fields).
rust-ini = "=0.21.1"

# Patched copies of two database drivers; see vendor/README.md for what changed and why.
[patch.crates-io]
sqlx-mysql = { path = "vendor/sqlx-mysql" }
tiberius = { path = "vendor/tiberius" }
