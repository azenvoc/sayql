<!doctype html>
<!--
  The splash card shown while the main window loads (the "splash" window in
  src-tauri/tauri.conf.json). It has no scripts, so it needs no permissions and draws at once;
  src-tauri/src/commands/app.rs closes it when the main window is ready. The logo is the same
  artwork as src/components/ui/BrandMark.tsx, and its hex colors are fixed on purpose, like there.
  %SAYQL_VERSION% is replaced with the app's version by vite.config.ts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SayQL</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #15171a;
        color: #e8eaed;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Ubuntu, Cantarell, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .card {
        position: relative;
        box-sizing: border-box;
        height: 100%;
        padding: 40px 40px 0;
        display: flex;
        flex-direction: column;
        background: radial-gradient(120% 90% at 0% 0%, #23282d 0%, #15171a 60%);
        border: 1px solid #2a2f35;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .edition {
        margin: 14px 0 0 90px;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a78bfa;
      }
      .footer {
        margin-top: auto;
        padding-bottom: 26px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 12px;
        color: #8b939c;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        overflow: hidden;
        background: #22272c;
      }
      .bar::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 30%;
        background: linear-gradient(90deg, transparent, #a78bfa, #4a8dff, transparent);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          left: -30%;
        }
        to {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          left: 0;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
